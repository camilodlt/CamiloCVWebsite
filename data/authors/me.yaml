role: Final-year PhD Student in Machine Learning and Genetic Programming
bio: |
  I am from Ecuador and have been living in France since 2015. I studied
  economics, sociology, and computer science, completing a master's degree in
  each field before starting my PhD.

  I am currently in the third year of my PhD, supervised by Sylvain
  Cussat-Blanc, Dennis Wilson, and Hervé Luga. My doctoral work focuses on
  developing a type-aware extension of Cartesian Genetic Programming, with
  applications to program synthesis, game playing, and image classification.

  More recently, I have been exploring the intersection of deep learning and
  genetic programming, with the goal of improving GP systems to approach deep
  learning performance while remaining interpretable.

